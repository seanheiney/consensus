name: Consensus panel
description: Put a question to a panel of models that debate it adversarially and return one answer, with confidence and unresolved disagreements.
branding:
  icon: users
  color: purple

inputs:
  mode:
    description: 'run (default): the full debate. check: every seat answers once, no debate; sets agreement and needs-human, a cheap gate before a full run.'
    required: false
    default: run
  prompt:
    description: The question, fully self-contained. Panelists cannot see the repo.
    required: true
  context:
    description: Supporting material pasted inline (code, diff, constraints).
    required: false
  context-file:
    description: File whose contents are used as the context (appended after `context`).
    required: false
  untrusted-file:
    description: 'Quarantine mode: file(s) the panel must analyze but never take instructions from (a third-party plugin, a stranger''s PR). One path per line. Injection attempts are listed in the report.'
    required: false
  profile:
    description: Named profile from the repo's consensus.config.json.
    required: false
  panel:
    description: 'Comma-separated seats, e.g. "groq:openai/gpt-oss-120b,anthropic:claude-opus-5".'
    required: false
  variants:
    description: Seat the panel's model(s) this many times, each under a different reasoning angle.
    required: false
  for:
    description: Task preset - code-review, architecture, debug, security, product, estimate.
    required: false
  rounds:
    description: Maximum critique/revise rounds.
    required: false
  effort:
    description: low | medium | high | xhigh | max
    required: false
  verify:
    description: 'Check the report''s load-bearing claims against the context supplied ("true").'
    required: false
    default: "false"
  escalate:
    description: Profile to promote to when the first panel leaves the question unsettled.
    required: false
  escalate-when:
    description: unsettled (default) | disputed | always
    required: false
  max-cost:
    description: Abort once spend billed to API keys exceeds this many USD. Strongly recommended in CI.
    required: false
    default: "2"
  timeout-minutes:
    description: Kill any single model call after this many minutes.
    required: false
    default: "10"
  comment:
    description: 'Post the answer as a comment on the pull request ("true"). Needs github-token and pull-requests: write.'
    required: false
    default: "false"
  github-token:
    description: Token used to post the comment.
    required: false
    default: ${{ github.token }}
  node-version:
    description: Node.js version used to run the CLI.
    required: false
    default: "22"

outputs:
  answer:
    description: The panel's answer section.
    value: ${{ steps.run.outputs.answer }}
  converged:
    description: "true when every seat accepted every other seat's answer."
    value: ${{ steps.run.outputs.converged }}
  run-id:
    description: Id of the saved run.
    value: ${{ steps.run.outputs.run-id }}
  report:
    description: Path to the full markdown report.
    value: ${{ steps.run.outputs.report }}
  agreement:
    description: 'mode: check only. unanimous, majority, split, or insufficient (fewer than two seats answered).'
    value: ${{ steps.run.outputs.agreement }}
  needs-human:
    description: 'mode: check only. "true" unless every seat that answered agreed.'
    value: ${{ steps.run.outputs.needs-human }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - id: run
      shell: bash
      env:
        IN_PROMPT: ${{ inputs.prompt }}
        IN_CONTEXT: ${{ inputs.context }}
        IN_CONTEXT_FILE: ${{ inputs.context-file }}
        IN_UNTRUSTED_FILE: ${{ inputs.untrusted-file }}
        IN_PROFILE: ${{ inputs.profile }}
        IN_PANEL: ${{ inputs.panel }}
        IN_VARIANTS: ${{ inputs.variants }}
        IN_FOR: ${{ inputs.for }}
        IN_ROUNDS: ${{ inputs.rounds }}
        IN_EFFORT: ${{ inputs.effort }}
        IN_VERIFY: ${{ inputs.verify }}
        IN_ESCALATE: ${{ inputs.escalate }}
        IN_ESCALATE_WHEN: ${{ inputs.escalate-when }}
        IN_MAX_COST: ${{ inputs.max-cost }}
        IN_TIMEOUT: ${{ inputs.timeout-minutes }}
        IN_MODE: ${{ inputs.mode }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # Subscription seats (claude/codex/gemini/grok CLIs) cannot run here: CI has no
        # vendor login, and the vendors' terms cover interactive use. Use API keys:
        # ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY, XAI_API_KEY, GROQ_API_KEY,
        # OPENROUTER_API_KEY - passed through as ordinary env vars by the calling workflow.
        out="${RUNNER_TEMP:-/tmp}/consensus-run.json"
        args=(run "$IN_PROMPT" --json -o "$out" --no-save --quiet --max-cost "$IN_MAX_COST" --timeout "$IN_TIMEOUT")
        ctx="$IN_CONTEXT"
        if [ -n "$IN_CONTEXT_FILE" ]; then ctx="$ctx
        $(cat "$IN_CONTEXT_FILE")"; fi
        if [ -n "${ctx// /}" ]; then
          ctxfile="${RUNNER_TEMP:-/tmp}/consensus-context.md"
          printf '%s' "$ctx" > "$ctxfile"
          args+=(--context "$ctxfile")
        fi
        # `[ -n "$X" ] && args+=(...)` would abort the step under `set -e` whenever the
        # input is empty, so each optional input gets a real if.
        add_if_set() { if [ -n "$2" ]; then args+=("$1" "$2"); fi; }
        add_if_set --profile "$IN_PROFILE"
        add_if_set --panel "$IN_PANEL"
        add_if_set --variants "$IN_VARIANTS"
        add_if_set --for "$IN_FOR"
        add_if_set --rounds "$IN_ROUNDS"
        add_if_set --effort "$IN_EFFORT"
        add_if_set --escalate "$IN_ESCALATE"
        add_if_set --escalate-when "$IN_ESCALATE_WHEN"
        while IFS= read -r uf; do
          # Trim surrounding whitespace, including the CR a Windows-edited workflow leaves on each line.
          uf="${uf%$'\r'}"; uf="${uf#"${uf%%[![:space:]]*}"}"; uf="${uf%"${uf##*[![:space:]]}"}"
          if [ -n "$uf" ]; then args+=(--untrusted "$uf"); fi
        done <<< "$IN_UNTRUSTED_FILE"
        if [ "$IN_VERIFY" = "true" ]; then args+=(--verify); fi

        case "$IN_MODE" in run | check | "") ;; *) echo "::error::mode must be run or check, not \"$IN_MODE\""; exit 1 ;; esac
        if [ "$IN_MODE" = "check" ]; then
          # Cheap gate: every seat answers once, no debate. rounds, verify and escalate do not apply.
          out="${RUNNER_TEMP:-/tmp}/consensus-check.json"
          rm -f "$out"
          cargs=(check "$IN_PROMPT" --json -o "$out" --quiet --max-cost "$IN_MAX_COST" --timeout "$IN_TIMEOUT")
          if [ -n "${ctxfile:-}" ]; then cargs+=(--context "$ctxfile"); fi
          add_c() { if [ -n "$2" ]; then cargs+=("$1" "$2"); fi; }
          add_c --profile "$IN_PROFILE"
          add_c --panel "$IN_PANEL"
          add_c --variants "$IN_VARIANTS"
          add_c --for "$IN_FOR"
          add_c --effort "$IN_EFFORT"
          # 0 unanimous, 1 the models disagree, 2 no signal: all three are results, read from the outputs.
          # Without a result file the check itself failed (bad input, unreachable panel): fail the step.
          set +e
          node "$ACTION_PATH/dist/cli.js" "${cargs[@]}"
          code=$?
          set -e
          if [ ! -s "$out" ]; then exit "$code"; fi
          report="${RUNNER_TEMP:-/tmp}/consensus-report.md"
          node --input-type=module -e '
            import { appendFileSync, readFileSync, writeFileSync } from "node:fs";
            import { randomBytes } from "node:crypto";
            const { renderCheck } = await import(process.env.ACTION_PATH + "/dist/index.js");
            const r = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const md = renderCheck(r);
            writeFileSync(process.argv[2], md + "\n");
            const out = process.env.GITHUB_OUTPUT;
            const top = r.agreement === "unanimous" || r.agreement === "majority" ? r.positions[0].answer.replace(/\s+/g, " ") : "";
            // A random delimiter: a model-written answer cannot end the value early and inject outputs.
            const eof = `CONSENSUS_EOF_${randomBytes(16).toString("hex")}`;
            appendFileSync(out, `answer<<${eof}\n${top}\n${eof}\n`);
            appendFileSync(out, `agreement=${r.agreement}\n`);
            appendFileSync(out, `needs-human=${r.needsHuman}\n`);
            appendFileSync(out, `report=${process.argv[2]}\n`);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY ?? "/dev/null", md + "\n");
          ' "$out" "$report"
          exit 0
        fi

        # Exit 2 means the panel shrank but still answered; keep going and say so in the report.
        set +e
        node "$ACTION_PATH/dist/cli.js" "${args[@]}"
        code=$?
        set -e
        if [ "$code" != "0" ] && [ "$code" != "2" ]; then exit "$code"; fi

        report="${RUNNER_TEMP:-/tmp}/consensus-report.md"
        node --input-type=module -e '
          import { appendFileSync, readFileSync, writeFileSync } from "node:fs";
          import { randomBytes } from "node:crypto";
          const { renderReport } = await import(process.env.ACTION_PATH + "/dist/index.js");
          const run = JSON.parse(readFileSync(process.argv[1], "utf8"));
          const md = renderReport(run);
          writeFileSync(process.argv[2], md);
          const answer = (run.synthesis.match(/^#+\s*Answer\s*\n([\s\S]*?)(?=\n#|$)/im)?.[1] ?? run.synthesis).trim();
          const out = process.env.GITHUB_OUTPUT;
          // A random delimiter: a model-written answer cannot end the value early and inject outputs.
          const eof = `CONSENSUS_EOF_${randomBytes(16).toString("hex")}`;
          const block = (k, v) => `${k}<<${eof}\n${v}\n${eof}\n`;
          appendFileSync(out, block("answer", answer));
          appendFileSync(out, `converged=${run.converged}\n`);
          appendFileSync(out, `run-id=${run.id}\n`);
          appendFileSync(out, `report=${process.argv[2]}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY ?? "/dev/null", md + "\n");
        ' "$out" "$report"

    - if: inputs.comment == 'true' && github.event.pull_request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPORT: ${{ steps.run.outputs.report }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        {
          echo "## Consensus panel"
          echo
          cat "$REPORT"
        } > "${RUNNER_TEMP:-/tmp}/consensus-comment.md"
        gh pr comment "$PR" --repo "$REPO" --body-file "${RUNNER_TEMP:-/tmp}/consensus-comment.md"
